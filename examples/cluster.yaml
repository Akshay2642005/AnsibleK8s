# ansiblek8s-rs example configuration.
# Convert an existing Ansible inventory with: ansiblek8s-rs convert inventory/
name: example-lab
k3s_version: v1.30.2+k3s2

hosts:
  # 3 servers = control-plane quorum
  - address: 192.168.30.38
    role: server
  - address: 192.168.30.39
    role: server
  - address: 192.168.30.40
    role: server
  # 2 agents = workers
  - address: 192.168.30.41
    role: agent
  - address: 192.168.30.42
    role: agent

ssh:
  user: vagrant
  port: 22

network:
  cni_pod_cidr: 10.42.0.0/16
  cni_service_cidr: 10.43.0.0/16

load_balancer:
  # Choose exactly one pool (mutually exclusive, enforced by the deploy phase):
  kube_vip_lb_ip_range: 192.168.30.80-192.168.30.90
  # metal_lb_ip_range: 192.168.30.80-192.168.30.90
